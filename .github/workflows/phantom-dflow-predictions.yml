name: Senda Phantom and DFlow prediction safety
on:
  pull_request:
    paths:
      - 'src/lib/phantom-prediction-*.mjs'
      - 'src/lib/phantom-prediction-*.ts'
      - 'src/lib/dflow-prediction-*.mjs'
      - 'src/lib/dflow-prediction-*.ts'
      - 'src/lib/dflow-predictions.ts'
      - 'src/components/dflow-phantom-prediction.tsx'
      - 'src/components/phantom-predict-bridge.tsx'
      - 'src/components/event-markets-desk.tsx'
      - 'scripts/dflow-prediction-*.test.mjs'
      - 'scripts/phantom-prediction-*.test.mjs'
      - 'docs/PHANTOM_PREDICT_BRIDGE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predicted-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pure safety and ledger tests
        run: node --test scripts/phantom-prediction-intent.test.mjs scripts/dflow-prediction-core.test.mjs scripts/dflow-prediction-receipt.test.mjs scripts/event-contract-router.test.mjs
      - name: Install app dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build:dev
