name: Senda Kalshi Event Research Validation
on:
  pull_request:
    paths:
      - 'src/lib/event-contract-router.mjs'
      - 'src/lib/event-contract-router.d.mts'
      - 'src/lib/kalshi-depth.ts'
      - 'src/components/event-markets-desk.tsx'
      - 'src/routes/social/events.tsx'
      - 'scripts/event-contract-router.test.mjs'
      - 'docs/LIQUIFY_EVENT_PRODUCTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Kalshi orderbook math and product guards
        run: node --test scripts/event-contract-router.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build:dev
