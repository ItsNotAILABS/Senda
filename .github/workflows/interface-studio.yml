name: Senda Interface Studio validation
on:
  pull_request:
  push:
    branches:
      - feature/interface-studio-board-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run board and appearance rules
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/interface-board.test.mjs scripts/interface-theme.test.mjs 2>&1 | tee interface-unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-unit-diagnostics
          path: interface-unit.log
          if-no-files-found: warn
          retention-days: 7
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee interface-install.log
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee interface-typescript.log
      - name: Development build
        shell: bash
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee interface-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-app-diagnostics
          path: |
            interface-install.log
            interface-typescript.log
            interface-build.log
          if-no-files-found: warn
          retention-days: 7
