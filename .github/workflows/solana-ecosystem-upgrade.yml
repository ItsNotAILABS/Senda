name: Solana ecosystem 2026 upgrade gates
on:
  pull_request:
    paths:
      - "src/lib/jup-tape.ts"
      - "src/lib/hold-marks.ts"
      - "src/lib/chain-tape.ts"
      - "src/lib/world-book.ts"
      - "src/lib/pools/read.ts"
      - "src/lib/table-pot.ts"
      - "mcp/tools.mjs"
      - "src/lib/jup-exec.ts"
      - "src/lib/jupiter-v2-preview.ts"
      - "src/lib/token-safety.ts"
      - "src/lib/ecosystem-upgrade-core.mjs"
      - "src/components/jup-ticket.tsx"
      - "src/components/jupiter-v2-preview.tsx"
      - "src/components/token-safety-panel.tsx"
      - "src/routes/invest/routes.tsx"
      - "scripts/ecosystem-upgrade.test.mjs"
      - "scripts/jupiter-endpoint-regression.test.mjs"
      - "config/solana-ecosystem-scout.json"
      - ".github/workflows/solana-ecosystem-upgrade.yml"
  workflow_dispatch:
jobs:
  ecosystem-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ecosystem quote, token and agent payment contracts
        run: node --test scripts/ecosystem-upgrade.test.mjs scripts/jupiter-endpoint-regression.test.mjs
      - name: Senda typecheck
        run: npm run typecheck
      - name: Existing Senda tests
        run: npm test
      - name: App compilation
        run: npm run build:dev
