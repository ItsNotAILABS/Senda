name: Bitso Mexico Readiness (No Transfers)
on:
  pull_request:
    paths:
      - 'services/bitso-business/**'
      - 'scripts/bitso-business.test.mjs'
      - 'scripts/bitso-withdrawals.test.mjs'
      - 'scripts/bitso-webhooks.test.mjs'
      - 'scripts/bitso-postgres.test.mjs'
      - 'docs/BITSO_MEXICO_INTEGRATION.md'
      - '.github/workflows/bitso-mexico.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test Bitso read-only HMAC and Mexico payout guards
        run: node --test scripts/bitso-business.test.mjs scripts/bitso-withdrawals.test.mjs scripts/bitso-webhooks.test.mjs scripts/bitso-postgres.test.mjs scripts/liquify-global.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Review build
        run: npm run build:dev
