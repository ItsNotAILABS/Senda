name: Senda money public-release hardening
on:
  pull_request:
    paths:
      - 'src/lib/friend-payments.*'
      - 'src/lib/money-settlement-core.*'
      - 'src/lib/paper-money-policy.*'
      - 'src/lib/usdc-amount.*'
      - 'src/lib/spl-instructions.*'
      - 'src/lib/journaled-send.*'
      - 'src/lib/tx-journal.*'
      - 'src/lib/solana-pay.ts'
      - 'src/lib/solana-pay-request.*'
      - 'src/lib/phantom.ts'
      - 'src/lib/receive-account*'
      - 'src/lib/wallet.ts'
      - 'src/lib/use-wallet.ts'
      - 'src/components/friends-money-desk.tsx'
      - 'src/components/money-rail-view.tsx'
      - 'src/components/account-details.tsx'
      - 'src/routes/payments/**'
      - 'migrations/0009_receive_auth_nonce.sql'
      - 'scripts/friend-payments.test.mjs'
      - 'scripts/usdc-amount.test.mjs'
      - 'scripts/spl-instructions.test.mjs'
      - 'scripts/journaled-send.test.mjs'
      - 'scripts/solana-pay-request.test.mjs'
      - 'scripts/receive-account-auth.test.mjs'
      - 'scripts/*money*.test.mjs'
      - 'tsconfig.money.json'
      - '.github/workflows/senda-money-public.yml'
      - 'docs/SENDA_MONEY_PUBLIC_LAUNCH.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Money behavior tests
        run: >-
          node --test
          scripts/friend-payments.test.mjs
          scripts/usdc-amount.test.mjs
          scripts/spl-instructions.test.mjs
          scripts/journaled-send.test.mjs
          scripts/solana-pay-request.test.mjs
          scripts/money-settlement-core.test.mjs
          scripts/receive-account-auth.test.mjs
          scripts/paper-money-policy.test.mjs
          scripts/money-public-safety.test.mjs
      # Scoped to the money surface: the repo-wide `npm run typecheck` has
      # pre-existing errors unrelated to this workflow.
      - name: TypeScript (money files)
        run: npx tsc --noEmit -p tsconfig.money.json
      - name: Build
        run: npm run build:dev
